name: Release

on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Whether this release is a pre-release'
        type: boolean
        required: false
        default: false
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        required: false
        default: false
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest
    env:
      HAS_NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}

    steps:
      - name: Validate Tag Ref
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag' -or -not ('${{ github.ref_name }}' -like 'v*')) {
            throw "Release workflow must run on a version tag (vX.Y.Z or vX.Y.Z-rcN). Got: ${{ github.ref_type }}/${{ github.ref_name }}"
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.has-artifact && 'false' || 'recursive' }}
          fetch-depth: 1

      - name: Read tag message
        id: tagmsg
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          git fetch --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          $msg = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $msg) { $msg = "EDPE Release $tag" }
          $nexusNotice = "If you'd like to support me, please download the mod from [Nexus Mods](https://www.nexusmods.com/elitedangerous/mods/15?tab=files)."
          $msg = "$nexusNotice`n`n$msg"
          Set-Content -Path "tag-message.md" -Value $msg -Encoding utf8
          Write-Host "Tag message:"
          Write-Host $msg

      - name: Build EDPE (Release)
        if: ${{ !inputs.has-artifact }}
        uses: ./.github/actions/build-edpe
        with:
          edpe-version: ${{ github.ref_name }}
          build-target: proxy_stage
          run-tests: 'false'

      - name: Download Staged Binaries
        if: ${{ inputs.has-artifact }}
        uses: actions/download-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage

      - name: Prepare Release Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkgDir = "EDPE-package"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          # Copy staged runtime DLLs (dxgi, DLSS, FidelityFX FG, Streamline)
          Copy-Item "build/stage/*.dll" -Destination "$pkgDir/" -Force

          # Copy documentation and default configuration
          Copy-Item "README.md" -Destination "$pkgDir/" -Force
          if (Test-Path "edpe.ini") {
            Copy-Item "edpe.ini" -Destination "$pkgDir/" -Force
          }

          $archiveName = "EDPE($tag).zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath $archiveName -Force

          # Generate SHA256 checksum and sidecar file
          $sha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash
          $shaFile = "$archiveName.sha256"
          Set-Content -Path $shaFile -Value "$sha256  $archiveName" -Encoding ascii

          Write-Host "Created archive: $archiveName (SHA-256: $sha256)"
          $cleanVersion = $tag -replace '^v', ''
          $tagMsg = if (Test-Path "tag-message.md") { (Get-Content -Path "tag-message.md" -Raw -Encoding utf8).Trim() } else { "EDPE Release $tag" }
          $delim = "NEXUS_EOF_$([guid]::NewGuid().ToString('N'))"
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha_file=$shaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "clean_version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "changelog<<$delim`n$tagMsg`n$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.sha_file }}
          name: ${{ (inputs.prerelease || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) && format('EDPE {0} (Pre-release)', github.ref_name) || format('EDPE {0}', github.ref_name) }}
          tag_name: ${{ github.ref_name }}
          body_path: tag-message.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ (inputs.prerelease || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) && 'false' || 'true' }}

      - name: Upload Release to Nexus Mods
        id: nexus
        if: >-
          env.HAS_NEXUSMODS_API_KEY == 'true' &&
          vars.NEXUSMODS_FILE_ID != '' &&
          github.ref_type == 'tag' &&
          !(inputs.prerelease || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha'))
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.package.outputs.archive_name }}
          version: ${{ steps.package.outputs.clean_version }}
          display_name: EDPE(V${{ steps.package.outputs.clean_version }})
          description: Automated release from GitHub (${{ steps.release.outputs.url }})
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'true'
          changelog: ${{ vars.NEXUSMODS_MOD_ID != '' && steps.package.outputs.changelog || '' }}

      - name: Notify Discord (#releases-and-roadmap)
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
          IS_PRERELEASE: ${{ inputs.prerelease || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          NEXUS_OUTCOME: ${{ steps.nexus.outcome }}
        run: |
          if (-not $env:DISCORD_BOT_TOKEN -or -not $env:DISCORD_CHANNEL_ID) {
            Write-Host "DISCORD_BOT_TOKEN or DISCORD_RELEASE_CHANNEL_ID not set; skipping Discord post."
            return
          }

          $changelog = ""
          if (Test-Path "tag-message.md") {
            $changelog = (Get-Content -Path "tag-message.md" -Raw -Encoding utf8).Trim()
          }
          if ($changelog.Length -gt 3500) {
            $changelog = $changelog.Substring(0, 3500) + "`n..."
          }

          $isPre = ($env:IS_PRERELEASE -eq "true")
          $title = if ($isPre) { "EDPE $($env:RELEASE_TAG) (Pre-release)" } else { "EDPE $($env:RELEASE_TAG)" }
          $color = if ($isPre) { 0xF39C12 } else { 0x2ECC71 }

          $downloadValue = "[GitHub Release]($($env:RELEASE_URL))"
          if (-not ([string]::IsNullOrEmpty($env:NEXUS_MOD_ID))) {
            $nexusUrl = "https://www.nexusmods.com/elitedangerous/mods/$($env:NEXUS_MOD_ID)?tab=files"
            $downloadValue += " | [Nexus Mods]($nexusUrl)"
          }

          $payload = @{
            embeds = @(
              @{
                title = $title
                url = $env:RELEASE_URL
                description = $changelog
                color = $color
                fields = @(
                  @{ name = "Archive"; value = "``$($env:ARCHIVE_NAME)``"; inline = $true }
                  @{ name = "Download"; value = $downloadValue; inline = $true }
                  @{ name = "SHA-256"; value = "``$($env:ARCHIVE_SHA256)``"; inline = $false }
                )
                footer = @{ text = "EDPE Automated Release" }
              }
            )
          } | ConvertTo-Json -Depth 6

          $headers = @{
            "Authorization" = "Bot $($env:DISCORD_BOT_TOKEN)"
            "User-Agent"    = "EDPE-Release-Notifier/1.0"
          }

          try {
            Invoke-RestMethod -Method Post `
              -Uri "https://discord.com/api/v10/channels/$($env:DISCORD_CHANNEL_ID)/messages" `
              -Headers $headers `
              -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            Write-Host "Posted release announcement to Discord channel $($env:DISCORD_CHANNEL_ID)."
          } catch {
            Write-Warning "Failed to notify Discord: $_"
          }
