name: Release

on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Whether this release is a pre-release'
        type: boolean
        required: false
        default: false
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        required: false
        default: false
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.has-artifact && 'false' || 'recursive' }}
          fetch-depth: 1

      - name: Set up MSVC environment
        if: ${{ !inputs.has-artifact }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Read tag message
        id: tagmsg
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ('${{ github.ref_type }}' -eq 'tag') {
            git fetch --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
            $msg = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          } else {
            $msg = "EDPE Release $tag"
          }
          if (-not $msg) { $msg = "EDPE Release $tag" }
          Set-Content -Path "tag-message.md" -Value $msg -Encoding utf8
          Write-Host "Tag message:"
          Write-Host $msg

      - name: Cache NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-v1
          restore-keys: |
            dlss-sdk-${{ runner.os }}-

      - name: Clone NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact && steps.cache-dlss.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (sparse)..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Cache FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-ffx
        uses: actions/cache@v4
        with:
          path: external/ffx-dx11
          key: ffx-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_ffx_dx11.py') }}
          restore-keys: |
            ffx-sdk-${{ runner.os }}-

      - name: Fetch FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact && steps.cache-ffx.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          python tools/fetch_ffx_dx11.py

      - name: Set up sccache
        if: ${{ !inputs.has-artifact }}
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ runner.os }}-sccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-sccache-
          max-size: 2G

      - name: Configure CMake
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        run: |
          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DEDPE_VERSION="$ver" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build EDPE (Release)
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Download Staged Binaries
        if: ${{ inputs.has-artifact }}
        uses: actions/download-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage

      - name: Prepare Release Package
        id: package
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "build-${{ github.run_number }}" }
          $pkgDir = "EDPE-package"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          # Copy staged binaries
          Copy-Item "build/stage/dxgi.dll" -Destination "$pkgDir/" -Force
          if (Test-Path "build/stage/nvngx_dlss.dll") {
            Copy-Item "build/stage/nvngx_dlss.dll" -Destination "$pkgDir/" -Force
          }

          # Copy documentation and default configuration
          Copy-Item "README.md" -Destination "$pkgDir/" -Force
          if (Test-Path "edpe.ini") {
            Copy-Item "edpe.ini" -Destination "$pkgDir/" -Force
          }

          $archiveName = "EDPE($tag).zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath $archiveName -Force

          # Generate SHA256 checksum
          $sha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash

          Write-Host "Created archive: $archiveName (SHA-256: $sha256)"
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ steps.package.outputs.archive_name }}
          name: ${{ (inputs.prerelease || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha')) && format('EDPE {0} (Pre-release)', github.ref_name) || format('EDPE {0}', github.ref_name) }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('release-build-{0}', github.run_number) }}
          body_path: tag-message.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: ${{ (inputs.prerelease || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha')) && 'false' || 'true' }}

      - name: Notify Discord (#releases-and-roadmap)
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
          IS_PRERELEASE: ${{ inputs.prerelease || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        run: |
          if (-not $env:DISCORD_BOT_TOKEN -or -not $env:DISCORD_CHANNEL_ID) {
            Write-Host "DISCORD_BOT_TOKEN or DISCORD_RELEASE_CHANNEL_ID not set; skipping Discord post."
            return
          }

          $changelog = ""
          if (Test-Path "tag-message.md") {
            $changelog = (Get-Content -Path "tag-message.md" -Raw -Encoding utf8).Trim()
          }
          if ($changelog.Length -gt 3500) {
            $changelog = $changelog.Substring(0, 3500) + "`n..."
          }

          $isPre = ($env:IS_PRERELEASE -eq "true")
          $title = if ($isPre) { "EDPE $($env:RELEASE_TAG) (Pre-release)" } else { "EDPE $($env:RELEASE_TAG)" }
          $color = if ($isPre) { 0xF39C12 } else { 0x2ECC71 }

          $payload = @{
            embeds = @(
              @{
                title = $title
                url = $env:RELEASE_URL
                description = $changelog
                color = $color
                fields = @(
                  @{ name = "Archive"; value = "``$($env:ARCHIVE_NAME)``"; inline = $true }
                  @{ name = "Download"; value = "[GitHub Release]($($env:RELEASE_URL))"; inline = $true }
                  @{ name = "SHA-256"; value = "``$($env:ARCHIVE_SHA256)``"; inline = $false }
                )
                footer = @{ text = "EDPE Automated Release" }
              }
            )
          } | ConvertTo-Json -Depth 6

          $headers = @{
            "Authorization" = "Bot $($env:DISCORD_BOT_TOKEN)"
            "User-Agent"    = "EDPE-Release-Notifier/1.0"
          }

          try {
            Invoke-RestMethod -Method Post `
              -Uri "https://discord.com/api/v10/channels/$($env:DISCORD_CHANNEL_ID)/messages" `
              -Headers $headers `
              -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            Write-Host "Posted release announcement to Discord channel $($env:DISCORD_CHANNEL_ID)."
          } catch {
            Write-Warning "Failed to notify Discord: $_"
          }
