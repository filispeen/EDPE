name: Experimental Build

on:
  workflow_call:
    inputs:
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: true
      build-number:
        description: 'Build number for experimental release (leave empty for auto-increment by tag)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: false
      build-number:
        description: 'Build number for experimental release (leave empty for auto-increment by tag)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Experimental
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.has-artifact && 'false' || 'recursive' }}
          fetch-depth: 1

      - name: Determine Experimental Build Info
        id: build_info
        shell: pwsh
        run: |
          git fetch --depth=1 -f origin '+refs/tags/*:refs/tags/*'
          $customNum = "${{ inputs.build-number }}".Trim()

          if ('${{ github.ref_type }}' -eq 'tag') {
              $tag = '${{ github.ref_name }}'
              if ($tag -match '^(?:exp|experimental)-build-(\d+)$') {
                  $buildNum = $matches[1]
              } else {
                  $buildNum = $tag
              }
          } elseif (-not [string]::IsNullOrWhiteSpace($customNum)) {
              $buildNum = $customNum
              $tag = "exp-build-$buildNum"
          } else {
              $tags = git tag -l "exp-build-*" "experimental-build-*"
              $maxNum = 0
              foreach ($t in $tags) {
                  if ($t -match '^(?:exp|experimental)-build-(\d+)$') {
                      $n = [int]$matches[1]
                      if ($n -gt $maxNum) { $maxNum = $n }
                  }
              }
              $buildNum = $maxNum + 1
              $tag = "exp-build-$buildNum"
          }

          Write-Host "Determined Build Number: $buildNum"
          Write-Host "Determined Tag: $tag"
          "build_number=$buildNum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up MSVC environment
        if: ${{ !inputs.has-artifact }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-v1
          restore-keys: |
            dlss-sdk-${{ runner.os }}-

      - name: Clone NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact && steps.cache-dlss.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (sparse)..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Cache FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-ffx
        uses: actions/cache@v4
        with:
          path: external/ffx-dx11
          key: ffx-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_ffx_dx11.py') }}
          restore-keys: |
            ffx-sdk-${{ runner.os }}-

      - name: Fetch FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact && steps.cache-ffx.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          python tools/fetch_ffx_dx11.py

      - name: Set up sccache
        if: ${{ !inputs.has-artifact }}
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ runner.os }}-sccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-sccache-
          max-size: 2G

      - name: Configure CMake
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        run: |
          $ver = '${{ steps.build_info.outputs.tag_name }}'
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DEDPE_VERSION="$ver" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build EDPE (Release)
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Download Staged Binaries
        if: ${{ inputs.has-artifact }}
        uses: actions/download-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage

      - name: Prepare Experimental Package
        id: package
        shell: pwsh
        run: |
          $tag = '${{ steps.build_info.outputs.tag_name }}'
          $pkgDir = "EDPE-package"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          # Copy staged binaries
          Copy-Item "build/stage/dxgi.dll" -Destination "$pkgDir/" -Force
          if (Test-Path "build/stage/nvngx_dlss.dll") {
              Copy-Item "build/stage/nvngx_dlss.dll" -Destination "$pkgDir/" -Force
          }

          # Copy documentation and default configuration
          Copy-Item "README.md" -Destination "$pkgDir/" -Force
          if (Test-Path "edpe.ini") {
              Copy-Item "edpe.ini" -Destination "$pkgDir/" -Force
          }

          $archiveName = "EDPE($tag).zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath $archiveName -Force

          # Generate SHA256 checksum
          $sha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash

          Write-Host "Created archive: $archiveName (SHA-256: $sha256)"
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDPE-experimental-build-${{ steps.build_info.outputs.build_number }}-windows-x64
          path: |
            ${{ steps.package.outputs.archive_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: EDPE Experimental Build #${{ steps.build_info.outputs.build_number }}
          files: |
            ${{ steps.package.outputs.archive_name }}
          generate_release_notes: true
          draft: false
          prerelease: true
