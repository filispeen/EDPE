name: Experimental Build

on:
  workflow_call:
    inputs:
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: true
      build-number:
        description: 'Build number for experimental release (leave empty for auto-increment by tag)'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      has-artifact:
        description: 'Whether staged binaries were pre-built by CI'
        type: boolean
        required: false
        default: false
      build-number:
        description: 'Build number for experimental release (leave empty for auto-increment by tag)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  build-and-release:
    name: Build and Publish Experimental
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.has-artifact && 'false' || 'recursive' }}
          fetch-depth: 1

      - name: Determine Experimental Build Info
        id: build_info
        shell: pwsh
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --depth=1 -f origin '+refs/tags/*:refs/tags/*'
          $customNum = "$env:BUILD_NUMBER_INPUT".Trim()

          if ($env:REF_TYPE -eq 'tag') {
              $tag = $env:REF_NAME
              if ($tag -match '^(?:exp|experimental)-build-(\d+)$') {
                  $buildNum = $matches[1]
              } else {
                  $buildNum = $tag
              }
          } elseif (-not [string]::IsNullOrWhiteSpace($customNum)) {
              $buildNum = $customNum
              $tag = "exp-build-$buildNum"
          } else {
              $tags = git tag -l "exp-build-*" "experimental-build-*"
              $maxNum = 0
              foreach ($t in $tags) {
                  if ($t -match '^(?:exp|experimental)-build-(\d+)$') {
                      $n = [int]$matches[1]
                      if ($n -gt $maxNum) { $maxNum = $n }
                  }
              }
              $buildNum = $maxNum + 1
              $tag = "exp-build-$buildNum"
          }

          Write-Host "Determined Build Number: $buildNum"
          Write-Host "Determined Tag: $tag"
          "build_number=$buildNum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Find Linked Issue
        id: linked_issue
        continue-on-error: true
        shell: pwsh
        env:
          PHASE: discover
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/experimental_issue_status.py

      - name: Notify Linked Issue (Build Started)
        id: issue_start
        if: ${{ steps.linked_issue.outputs.has_issue == 'true' }}
        continue-on-error: true
        shell: pwsh
        env:
          PHASE: start
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.build_info.outputs.tag_name }}
          BRANCH_NAME: ${{ steps.linked_issue.outputs.branch_name }}
          ISSUE_NUMBERS: ${{ steps.linked_issue.outputs.issue_numbers }}
          HAS_ARTIFACT: ${{ inputs.has-artifact }}
        run: |
          python .github/scripts/experimental_issue_status.py

      - name: Set up MSVC environment
        if: ${{ !inputs.has-artifact }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-v1
          restore-keys: |
            dlss-sdk-${{ runner.os }}-

      - name: Clone NVIDIA DLSS SDK
        if: ${{ !inputs.has-artifact && steps.cache-dlss.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (sparse)..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Cache FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-ffx
        uses: actions/cache@v4
        with:
          path: external/ffx-dx11
          key: ffx-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_ffx_dx11.py') }}
          restore-keys: |
            ffx-sdk-${{ runner.os }}-

      - name: Fetch FidelityFX DX11 SDK
        if: ${{ !inputs.has-artifact && steps.cache-ffx.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          python tools/fetch_ffx_dx11.py

      - name: Cache FidelityFX FG SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-ffx-fg
        uses: actions/cache@v4
        with:
          path: external/ffx-sdk
          key: ffx-fg-sdk-${{ runner.os }}-v2.4.0
          restore-keys: |
            ffx-fg-sdk-${{ runner.os }}-

      - name: Clone FidelityFX FG SDK
        if: ${{ !inputs.has-artifact && steps.cache-ffx-fg.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "external/ffx-sdk/Kits/FidelityFX/framegeneration/include/ffx_framegeneration.h")) {
            Write-Host "Cloning official AMD FidelityFX SDK v2.4.0 (sparse)..."
            git clone --depth 1 --branch v2.4.0 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git external/ffx-sdk
            Push-Location external/ffx-sdk
            git sparse-checkout set Kits/FidelityFX/api Kits/FidelityFX/framegeneration Kits/FidelityFX/signedbin LICENSE.txt
            Pop-Location
            Remove-Item -Recurse -Force external/ffx-sdk/.git
          } else {
            Write-Host "FidelityFX FG SDK found in cache."
          }

      - name: Cache NVIDIA Streamline SDK
        if: ${{ !inputs.has-artifact }}
        id: cache-streamline
        uses: actions/cache@v4
        with:
          path: external/streamline
          key: streamline-sdk-${{ runner.os }}-v2.14.16
          restore-keys: |
            streamline-sdk-${{ runner.os }}-

      - name: Clone NVIDIA Streamline SDK
        if: ${{ !inputs.has-artifact && steps.cache-streamline.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "external/streamline/include/sl_dlss_g.h")) {
            Write-Host "Cloning official NVIDIA Streamline SDK v2.14.16 (sparse)..."
            git clone --depth 1 --branch v2.14.16 --filter=blob:none --sparse https://github.com/NVIDIA-RTX/Streamline.git external/streamline
            Push-Location external/streamline
            git sparse-checkout set include bin/x64 LICENSE.txt
            Pop-Location
            Remove-Item -Recurse -Force external/streamline/.git
          } else {
            Write-Host "NVIDIA Streamline SDK found in cache."
          }

      - name: Set up sccache
        if: ${{ !inputs.has-artifact }}
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ runner.os }}-sccache-${{ github.ref_name }}
          restore-keys: |
            sccache-${{ runner.os }}-sccache-${{ github.event.repository.default_branch }}-
            sccache-${{ runner.os }}-sccache-
          max-size: 2G

      - name: Configure CMake
        id: configure
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        env:
          EDPE_VERSION: ${{ steps.build_info.outputs.tag_name }}
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DEDPE_VERSION="$env:EDPE_VERSION" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build EDPE (Release)
        id: build
        if: ${{ !inputs.has-artifact }}
        shell: pwsh
        run: |
          cmake --build build --target proxy_stage --parallel

      - name: Notify Linked Issue (Build Completed)
        if: ${{ !inputs.has-artifact && steps.issue_start.outputs.comment_ids != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          PHASE: after_build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.build_info.outputs.tag_name }}
          BRANCH_NAME: ${{ steps.linked_issue.outputs.branch_name }}
          COMMENT_IDS: ${{ steps.issue_start.outputs.comment_ids }}
          HAS_ARTIFACT: ${{ inputs.has-artifact }}
        run: |
          python .github/scripts/experimental_issue_status.py

      - name: Download Staged Binaries
        id: download
        if: ${{ inputs.has-artifact }}
        uses: actions/download-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage

      - name: Prepare Experimental Package
        id: package
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.build_info.outputs.tag_name }}
        run: |
          $tag = $env:TAG_NAME
          $pkgDir = "EDPE-package"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          # Copy staged runtime DLLs (dxgi, DLSS, FidelityFX FG, Streamline)
          Copy-Item "build/stage/*.dll" -Destination "$pkgDir/" -Force

          # Copy documentation and default configuration
          Copy-Item "README.md" -Destination "$pkgDir/" -Force
          if (Test-Path "edpe.ini") {
              Copy-Item "edpe.ini" -Destination "$pkgDir/" -Force
          }

          $archiveName = "EDPE($tag).zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath $archiveName -Force

          # Generate SHA256 checksum
          $sha256 = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash

          Write-Host "Created archive: $archiveName (SHA-256: $sha256)"
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Notify Linked Issue (Package Ready)
        if: ${{ steps.issue_start.outputs.comment_ids != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          PHASE: after_package
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.build_info.outputs.tag_name }}
          BRANCH_NAME: ${{ steps.linked_issue.outputs.branch_name }}
          COMMENT_IDS: ${{ steps.issue_start.outputs.comment_ids }}
          HAS_ARTIFACT: ${{ inputs.has-artifact }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          python .github/scripts/experimental_issue_status.py

      - name: Upload Build Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDPE-experimental-build-${{ steps.build_info.outputs.build_number }}-windows-x64
          path: |
            ${{ steps.package.outputs.archive_name }}

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: EDPE Experimental Build #${{ steps.build_info.outputs.build_number }}
          files: |
            ${{ steps.package.outputs.archive_name }}
          generate_release_notes: true
          draft: false
          prerelease: true

      - name: Notify Linked Issue (Final Result)
        if: ${{ always() && steps.issue_start.outputs.comment_ids != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          PHASE: finish
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.build_info.outputs.tag_name }}
          BRANCH_NAME: ${{ steps.linked_issue.outputs.branch_name }}
          COMMENT_IDS: ${{ steps.issue_start.outputs.comment_ids }}
          HAS_ARTIFACT: ${{ inputs.has-artifact }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          python .github/scripts/experimental_issue_status.py
