name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      rc:
        description: 'Publish as Release Candidate (Pre-release)'
        type: boolean
        default: false
      experimental:
        description: 'Publish experimental release'
        type: boolean
        default: false
      build_number:
        description: 'Build number for experimental release (leave empty for auto-increment by tag)'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  CI:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache NVIDIA DLSS SDK
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-v1
          restore-keys: |
            dlss-sdk-${{ runner.os }}-

      - name: Clone NVIDIA DLSS SDK
        if: steps.cache-dlss.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (sparse)..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Cache FidelityFX DX11 SDK
        id: cache-ffx
        uses: actions/cache@v4
        with:
          path: external/ffx-dx11
          key: ffx-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_ffx_dx11.py') }}
          restore-keys: |
            ffx-sdk-${{ runner.os }}-

      - name: Fetch FidelityFX DX11 SDK
        if: steps.cache-ffx.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python tools/fetch_ffx_dx11.py

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: ${{ runner.os }}-sccache-${{ github.ref_name }}
          restore-keys: |
            sccache-${{ runner.os }}-sccache-${{ github.event.repository.default_branch }}-
            sccache-${{ runner.os }}-sccache-
          max-size: 2G

      - name: Configure CMake
        shell: pwsh
        run: |
          $ver = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } elseif ('${{ inputs.experimental }}' -eq 'true') {
            git fetch --depth=1 -f origin '+refs/tags/*:refs/tags/*'
            $customNum = "${{ inputs.build_number }}".Trim()
            if (-not [string]::IsNullOrWhiteSpace($customNum)) {
              "exp-build-$customNum"
            } else {
              $tags = git tag -l "exp-build-*" "experimental-build-*"
              $maxNum = 0
              foreach ($t in $tags) {
                if ($t -match '^(?:exp|experimental)-build-(\d+)$') {
                  $n = [int]$matches[1]
                  if ($n -gt $maxNum) { $maxNum = $n }
                }
              }
              "exp-build-$($maxNum + 1)"
            }
          } else {
            'dev'
          }
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DEDPE_VERSION="$ver" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build EDPE (Release)
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure

      - name: Upload Staged Binaries
        if: (github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'rc') || startsWith(github.ref_name, 'exp') || startsWith(github.ref_name, 'experimental'))) || inputs.rc == true || inputs.experimental == true
        uses: actions/upload-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage/
          retention-days: 1

  release:
    name: Publish Release
    needs: CI
    if: (github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'rc'))) || inputs.rc == true
    uses: ./.github/workflows/release.yml
    with:
      prerelease: ${{ inputs.rc == true || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
      has-artifact: true
    secrets: inherit
    permissions:
      contents: write

  experimental:
    name: Publish Experimental
    needs: CI
    if: (github.ref_type == 'tag' && (startsWith(github.ref_name, 'exp') || startsWith(github.ref_name, 'experimental'))) || inputs.experimental == true
    uses: ./.github/workflows/experimental.yml
    with:
      has-artifact: true
      build-number: ${{ inputs.build_number || '' }}
    secrets: inherit
    permissions:
      contents: write
