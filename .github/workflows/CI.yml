name: CI

on:
  push:
    branches: 
      - master
      - experimental
  pull_request:
    branches:
      - master
      - experimental

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NV_DLSS_TAG: "v3.7.20"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache NVIDIA DLSS SDK
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-${{ env.NV_DLSS_TAG }}

      - name: Clone NVIDIA DLSS SDK
        if: steps.cache-dlss.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (${{ env.NV_DLSS_TAG }})..."
            git clone --depth 1 --branch ${{ env.NV_DLSS_TAG }} --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build EDPE (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edpe-binaries
          path: |
            build/Release/*.dll
            build/Release/*.exe
            build/stage/*

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edpe-test-logs
          path: |
            build/Testing/Temporary/*
            build/Release/edpe.log
            build/stage/edpe.log
