name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      experimental:
        description: 'Publish experimental release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  CI:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache NVIDIA DLSS SDK
        id: cache-dlss
        uses: actions/cache@v4
        with:
          path: external/DLSS
          key: dlss-sdk-${{ runner.os }}-v1
          restore-keys: |
            dlss-sdk-${{ runner.os }}-

      - name: Clone NVIDIA DLSS SDK
        if: steps.cache-dlss.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "external/DLSS/include/nvsdk_ngx.h")) {
            Write-Host "Cloning official NVIDIA DLSS SDK (sparse)..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
            Push-Location external/DLSS
            git sparse-checkout set include lib/Windows_x86_64
            Pop-Location
            # Remove .git metadata to keep cache size minimal (~370MB vs ~1.4GB)
            Remove-Item -Recurse -Force external/DLSS/.git
          } else {
            Write-Host "NVIDIA DLSS SDK found in cache."
          }

      - name: Cache FidelityFX DX11 SDK
        id: cache-ffx
        uses: actions/cache@v4
        with:
          path: external/ffx-dx11
          key: ffx-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_ffx_dx11.py') }}
          restore-keys: |
            ffx-sdk-${{ runner.os }}-

      - name: Fetch FidelityFX DX11 SDK
        if: steps.cache-ffx.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python tools/fetch_ffx_dx11.py

      - name: Cache EDPE Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: edpe-build-${{ runner.os }}-v1-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', '.gitmodules', 'src/**', 'external/imgui/**', 'tests/**', 'tools/**') }}
          restore-keys: |
            edpe-build-${{ runner.os }}-v1-${{ github.ref_name }}-
            edpe-build-${{ runner.os }}-v1-

      - name: Configure CMake
        shell: pwsh
        run: |
          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          cmake -S . -B build -A x64 -DEDPE_VERSION="$ver"

      - name: Build EDPE (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

  release:
    name: Publish Release
    needs: CI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write

  experimental:
    name: Publish Experimental
    needs: CI
    if: (github.ref_type == 'tag' && (startsWith(github.ref_name, 'exp') || startsWith(github.ref_name, 'experimental'))) || inputs.experimental == true
    uses: ./.github/workflows/experimental.yml
    secrets: inherit
    permissions:
      contents: write
