name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish_test_build:
        description: 'Publish isolated test build to the rolling test-builds pre-release'
        type: boolean
        default: false
      issue_number:
        description: 'Target issue number (optional; auto-detected from branch/PR if empty)'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  CI:
    name: Build and Test
    runs-on: windows-latest
    outputs:
      edpe_version: ${{ steps.meta.outputs.edpe_version }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      issue_number: ${{ steps.meta.outputs.issue_number }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute Version and Metadata
        id: meta
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_TEST_BUILD: ${{ inputs.publish_test_build }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          $baseTag = (git describe --tags --abbrev=0 --match "v*" 2>$null | Out-String).Trim()
          if (-not $baseTag) {
            $baseTag = "v0.0.0"
          }

          $issue = "$env:INPUT_ISSUE".Trim() -replace '^#', ''
          if (-not $issue -and $env:REF_TYPE -eq 'branch') {
            if ($env:REF_NAME -match '^#?(\d+)(?:[-_/]|$)') {
              $issue = $matches[1]
            } elseif ($env:REF_NAME -match '^(?:issue|fix|bug|feat|hotfix)[-_ /]#?(\d+)(?:[-_/]|$)') {
              $issue = $matches[1]
            }
          }

          if ($env:REF_TYPE -eq "tag") {
            $ver = $env:REF_NAME
          } elseif ($env:PUBLISH_TEST_BUILD -eq 'true') {
            $suffix = if ($issue) { "issue$issue.$shortSha" } else { "branch.$shortSha" }
            $ver = "$baseTag+$suffix"
          } else {
            $ver = "$baseTag+dev.$shortSha"
          }

          Write-Host "EDPE_VERSION: $ver (base: $baseTag, issue: $issue, sha: $shortSha)"
          "edpe_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "base_tag=$baseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "issue_number=$issue" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and Test EDPE
        uses: ./.github/actions/build-edpe
        with:
          edpe-version: ${{ steps.meta.outputs.edpe_version }}
          run-tests: 'true'

      - name: Run CI Script Unit Tests
        shell: pwsh
        run: |
          python .github/scripts/test_experimental_issue_status.py

      - name: Upload Staged Binaries
        if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || inputs.publish_test_build == true
        uses: actions/upload-artifact@v4
        with:
          name: edpe-stage-binaries
          path: build/stage/
          retention-days: 1

  release:
    name: Publish Release
    needs: CI
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/release.yml
    with:
      prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
      has-artifact: true
    secrets: inherit
    permissions:
      contents: write

  test-build:
    name: Publish Isolated Test Build
    needs: CI
    if: inputs.publish_test_build == true
    uses: ./.github/workflows/test-build.yml
    with:
      has-artifact: true
      edpe-version: ${{ needs.CI.outputs.edpe_version }}
      base-tag: ${{ needs.CI.outputs.base_tag }}
      issue-number: ${{ needs.CI.outputs.issue_number }}
      short-sha: ${{ needs.CI.outputs.short_sha }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: read
