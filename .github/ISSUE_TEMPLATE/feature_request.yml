name: Feature request
description: Suggest an improvement or a new feature for EDPE
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** Check existing issues and `PLAN.md` first. Keep requests within EDPE scope (graphics API / overlay / config, no game binary or network changes).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Upscaler backend (DLSS, FSR, XeSS, TAA)
        - Frame Generation (DLSS-G / FSR FG)
        - Overlay or menu
        - Performance HUD or telemetry
        - Camera, jitter, or motion vectors
        - HUD or UI handling
        - VR
        - Linux / Proton
        - Configuration
        - Build, CI, or release
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Problem & Proposed solution
      description: What is missing or annoying right now, and how should EDPE handle it (UI, hotkeys, or `edpe.ini` options)?
      placeholder: |
        Problem:

        Proposed solution:

        Alternatives / workarounds (optional): 
    validations:
      required: true
