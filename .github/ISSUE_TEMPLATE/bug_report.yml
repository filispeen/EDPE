name: Bug report
description: Report a rendering, stability, Frame Gen, or performance problem in EDPE
title: "Feet pictures selection in debug view dropdown doesn't do anything"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** Search existing issues first. Use an official release or CI test build, and drag-and-drop logs/media below instead of pasting huge logs.

  - type: input
    id: version_backend
    attributes:
      label: EDPE version & backend
      description: Exact version from the overlay or top of `edpe.log` + active upscaler/FG backend.
      placeholder: v0.8.0-rc2 (or v0.8.0-rc2+issue26.a1b2c3d) - DLSS + DLSS-G
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Problem type
      options:
        - Flickering or strobing
        - Ghosting or smearing
        - Frame Generation artifact / pacing
        - HUD or UI corruption
        - Black screen or bypass stuck
        - Crash or hang
        - FPS drop or stutter
        - Linux / Proton issue
        - Input or HOTAS problem
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Settings
      description: Fill in the values below (keep it short, one line per item).
      value: |
        GPU: 
        Driver: 
        OS: Windows 11 / Linux (Proton version)
        Mode: Odyssey / Horizons in desktop / VR
        Render scale & FG: e.g. 67%, DLSS-G / FSR FG / Off
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happens & Steps to reproduce
      description: Describe the bug, where it happens (station, planet, supercruise, on-foot), frequency, and whether Native / Bypass is affected.
      placeholder: |
        What happens:

        Steps to reproduce:
        1. 
        2. 
        3. 

        Frequency / happens in Native Bypass?: 
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (logs, config, media)
      description: Drag and drop `edpe.log` and `edpe.ini` here. Short video, screenshot, or RenderDoc `.rdc` capture is optional but very helpful.
      placeholder: Paste or drag-and-drop edpe.log, edpe.ini, screenshots, or video here...
    validations:
      required: true
