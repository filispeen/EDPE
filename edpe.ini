[Upscaler]
; Upscaler backend: 0 = Native (Bypass), 1 = NVIDIA DLSS/DLAA, 2 = AMD FSR; 3 = TAA
Backend=0
Sharpness=0.00

[TAA]
MinAlpha=0.045
MaxAlpha=0.25
BaseGamma=1.25
LockMaxGamma=2.25
RcasSharpness=0.30
ForceAniso16x=1
; DebugView (DEV=1 only): 0=Off, 1=Disocclusion, 2=ThinFeatureLock, 3=LumaInstability, 4=SampleCount
DebugView=0

[Jitter]
Enabled=1
InvertX=0
InvertY=0
SwapXY=0
Scale=1.00
PhaseCount=8
; Jitter injection route: auto (Upstream Cobra hook -> D3D11 CB fallback), d3d11, upstream
Mode=auto

[Motion]
ZeroMotion=0
InvertX=0
InvertY=0
Scale=1.00

[Overlay]
ShowPerfOverlay=1
EnableProfiler=0
Corner=1
Scale=1.50
UiScale=1.00
PosX=1900.0
PosY=496.0
DEV=0

[FrameLimiter]
; Asynchronous CPU-side post-Present Game FPS limiter (0 = Off, 10..500)
GameFpsLimit=0.0
